; supervisor/gpuq-runner.conf — installed by bootstrap.sh, not by hand.
; Placeholders are substituted at install time; that is what makes a
; rebuilt box identical rather than similar.
[program:gpuq-runner]
; Absolute interpreter, not a bare console-script name: supervisord runs
; with its own PATH, which will not include a venv's bin directory. A
; bare 'gpuq-runner' here fails with a bare 'ERROR (no such file)'.
command=@PYTHON@ -m gpuqueue.cli_runner --config @GPUQ_CONFIG@
directory=@GPUQ_PREFIX@
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=@QUEUE_ROOT@/logs/runner.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
; The autofix PAT is deliberately absent from the line below. Verified by
; hand: `%(ENV_X)s` fails supervisord's config *parse*, not just the token
; substitution, when X is unset -- exit 2, no program starts, on every box
; that has never heard of autofix. Export GPUQ_GITHUB_TOKEN where
; supervisord itself starts (e.g. /etc/default/supervisor) so the runner
; inherits it via a plain, always-present PATH/HOME-style environment; an
; unset token just means autofix logs a warning and the queue runs exactly
; as before.
environment=QUEUE_ROOT="@QUEUE_ROOT@",GPU_CLAIM_DIR="@GPU_CLAIM_DIR@",GPUQ_CONFIG="@GPUQ_CONFIG@",PYTHONUNBUFFERED="1"
