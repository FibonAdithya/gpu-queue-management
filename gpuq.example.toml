# Copied to $GPUQ_CONFIG by bootstrap.sh on first run, then never overwritten.
# Edit it in place and rerun bootstrap.sh to clone your projects.

[queue]
root = "/workspace/queue"
# 4, not the core count: typical CPU jobs here are BLAS-bound and already
# thread internally, so one per core oversubscribes. Measure before tuning.
cpu_slots = 4
poll_interval_s = 2.0
kill_orphan_cuda = true
# How often to sweep for CUDA processes no live job owns. This shells out to
# nvidia-smi, so it is throttled; the cheap recovery reaps run every poll.
orphan_cuda_interval_s = 60.0
# Every participant on the box must agree on this path, or two tools hold
# two different locks for the same card.
claim_dir = "/workspace/lock/gpu"

# One block per project the runner serves. Delete this example and add yours.
# Until you do, bootstrap.sh will report that it cannot clone it — expected,
# and not fatal.
[project.example]
remote   = "git@github.com:you/your-project.git"
checkout = "/workspace/checkouts/your-project"
# Put the environment holding torch here. It goes on the job's PATH, which is
# also what makes `-- python train.py` work on images that ship only python3.
venv     = "/venv/main"
commit_artifacts = true

# Where artifacts are published. Left as-is they are committed into the
# checkout above and die with the box. Uncomment to push them to a separate
# results repository instead, so the box needs write access to nothing but
# results -- anyone who can queue a job here can use that key.
# results_remote   = "git@github.com:you/your-results.git"
# results_checkout = "/workspace/checkouts/your-results"
# results_branch   = "main"

# When gpuq's own code raises, file a GitHub issue carrying the traceback so
# a headless Claude Code run can open a PR against it. Off by default:
# turning it on means this box holds a GitHub token, which is not something
# a config should inherit by accident.
#
# The token must be a fine-grained PAT scoped to `issues: write` on this
# repository and NOT `contents`. Anyone who can queue a job here can use it,
# exactly as with the results key above — the difference is that its worst
# case is issue spam rather than a push.
# [autofix]
# enabled = true
# repo    = "you/gpu-queue-management"
# The environment variable holding the PAT. Named rather than GH_TOKEN so an
# issues-only key is not inherited by every other tool on the box.
# token_env = "GPUQ_GITHUB_TOKEN"
# Auto-dispatches per rolling 24h. Past the cap the issue still files,
# labelled `throttled`, with no run: evidence is never lost, budget cannot
# run away.
# max_dispatches_per_day = 3
# closed_lookback_days = 30
